# Harness de non-regression, a chaque push.
#
# POURQUOI CE FICHIER EXISTE
# L'experience de ce depot est nette : sans integration continue, les tests
# cessent d'etre lances en quelques semaines. Les suites de `tests/unit/`
# etaient la depuis le debut ; plusieurs ne passaient plus, et personne ne le
# savait.
#
# CE QUI EST VERIFIABLE ICI, ET CE QUI NE L'EST PAS
# La couche NOYAU -- metamodele, FORM, tirage d'importance -- ne demande que
# numpy, scipy et pytest. Elle tourne donc partout, y compris sur un runner
# Linux, et c'est le sens du travail des phases 4b et 5 : le code n'est plus
# attache au poste de son auteur.
#
# Digital Structure, lui, n'est pas un paquet pip et exige une licence : les
# tests qui en dependent SAUTENT proprement. Le run de bout en bout sur
# l'etat limite analytique ne peut pas tourner ici non plus -- il lit sa
# geometrie dans un modele `.ds` qui n'est pas dans le depot.
#
# TOUT LE CONTROLE EST DANS PYTEST, RIEN N'EST ECRIT EN DOUBLE ICI.
# La regle « `_lib/` n'importe que numpy et scipy » est tenue par
# `tests/test_05_hygiene_depot.py`, pas par une etape de ce fichier : un
# controle qui n'existe que dans la CI ne protege pas celui qui travaille en
# local, et il faudrait l'ecrire deux fois -- en bash pour Linux, en
# PowerShell pour Windows.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  noyau:
    # La couche qui n'a besoin de rien : c'est elle qui porte l'essentiel du
    # code. La matrice n'est pas de la coquetterie -- elle verifie la
    # portabilite qu'on affirme dans le README. Attendu : 276 verts,
    # 9 sautes (Digital Structure, OpenTURNS, modele .ds absents).
    name: noyau ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: installer la couche noyau
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/core.txt

      - name: harness
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ""
        run: python -m pytest -q

  etudes:
    # La couche des scripts d'etude : OpenTURNS et compagnie, sans Digital
    # Structure. Python 3.10 uniquement -- c'est la contrainte des modules
    # compiles, et la CI doit tourner sous la meme version que la production.
    #
    # Ce job exerce ce que le precedent saute : les lois JCSS, le critere EFF
    # cote OpenTURNS, FORM multimodal, les traces.
    name: etudes py3.10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: installer la couche etudes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/studies.txt

      - name: harness
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ""
        run: python -m pytest -q --durations=15

[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = tests/unit historique _attic .git
addopts = -ra --strict-markers --durations=10
xfail_strict = false
markers =
    slow: test de plus de ~5 s
    golden: comparaison a une valeur figee (tests/golden/)
    oracle: comparaison a une verite analytique
    defect: defaut connu, non corrige

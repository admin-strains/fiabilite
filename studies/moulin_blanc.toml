# Pont du Moulin Blanc -- trafic LM1, deux resistances d'acier.
#
# Ce fichier ne contient QUE ce qui s'ecarte des defauts de
# `_config/schema.py`.
#
# Modele a 15 346 aciers repartis en deux groupes -- 13 858 en fyd1, 1 488 en
# fyd2. Mesure du 26/08/2026, UN point evalue de bout en bout :
#
#     construction CAD      ~105 s   (dsCad de 10 Mo, 188 094 lignes)
#     maillage                 9 s   (13 804 tetraedres)
#     solveur                353 s   (50 iterations, systeme 79 521)
#     ---------------------------
#     total                  466 s   soit 7,8 minutes PAR POINT
#
# C'est ce chiffre qui gouverne toutes les decisions ci-dessous.
#
# TROIS SORTES DE PARAMETRES, ET LA DIFFERENCE COMPTE
#   ETUDE    definit le probleme, change le RESULTAT.
#   SESSION  decrit comment CE run tourne ICI. Ne change pas le resultat.
#   SORTIE   ce qui est trace -- mais certains declenchent des centaines
#            d'appels au solveur, ce qui se compte ici en JOURS.

# =========================================================================== #
# ETUDE                                                                       #
# =========================================================================== #
modelname = "Calcul_fiabilite_G+LM1_13k_2fy_membrure_inf_diagonal"
storage = 'C:\workspace\storage\admin\Moulin_Blanc'

# --- metamodele
modele = "GEPCK"
max_degree = 2
# 0,0 -- valeur historique de cette etude, retrouvee le 27/08/2026 au
# fond de `build_metamodel_KRG`. Elle differait de la flexion pure
# (1,0) sans que rien ne le signale. Conservee telle quelle.
theta_min_krg = 0.0
max_of_maxdegree = 2
seuil_pce = 0.90

# --- enrichissement
# 360 points a 466 s = 47 HEURES. Le pic EFF est etroit et demande du budget,
# mais ce plafond doit etre choisi en connaissance du cout, pas recopie.
EFF_criteria = "BS"
n_max_EFF_points = 360

# --- domaine de recherche : BORNE (decision d'Agnes, 26/08/2026)
#
# CECI CHANGE LE RESULTAT DE L'ETUDE, et c'est voulu : le domaine precedent
# contenait des points que le modele mecanique ne sait pas representer.
#
# Les bornes valaient +/- 7,5, codees en dur dans le script (oubli de la phase
# 4b). Or `fy ~ Normal(235 ; 30,15)` n'est pas bornee en bas :
#
#     u = -7,5   ->  fy =   8,88 MPa   (plus faible que le beton)
#     u = -7,79  ->  fy =   0
#     u = -8,5   ->  fy = -21,27 MPa
#
# Le run du 26/08 est mort au point u = [+7,5 ; -7,5] : fy1/fy2 = 461/8,9,
# soit un rapport de 52 entre les deux groupes d'aciers, quand `docs/mesh/`
# donne ~5 comme seuil de mauvais conditionnement des cones SOCP. Digital
# Structure a termine le processus, sans exception ni trace.
#
# 6,0 est un COMPROMIS entre deux exigences inconciliables :
#   - contenir le point de conception (|u| ~ 5,3 d'apres le plan) : b >= 5,5
#   - garder le rapport aux coins <= 5                            : b <= 5,2
# Il reste donc un rapport de 7,7 aux coins. Justification complete et tableau
# dans `studies/moulin_blanc_fumee.toml`.
eff_bound_min = -6.0
eff_bound_max = 6.0

# La grille HF lit u1_min..u2_max, PAS eff_bounds : sans ces quatre lignes
# elle retournerait balayer les coins a +/- 7,5, c'est-a-dire exactement le
# point qui a tue le run.
u1_min = -6.0
u1_max = 6.0
u2_min = -6.0
u2_max = 6.0

# --- FORM
tol_FORM = 0.05
do_FORM_filter = true     # rejeter les u* hors bornes avant DBSCAN

# --- solveur lineaire du point interieur
# DECLARE EXPLICITEMENT depuis le 26/08/2026, a la valeur que
# `Moulinblanc/InitSolver.py` portait deja (IPARM0[21] = 4) : le resultat de
# cette etude est INCHANGE.
#
# Ce qui change, c'est qu'elle est visible. `pure_flexion` demandait MUMPS,
# cette etude CuDss, et rien ne le disait -- alors que c'est exactement la que
# se separent les deux reproductibilites mesurees (2,9e-11 contre 7,7e-06).
#
# MESURE DU 26/08/2026, meme point du plan, les deux backends :
#     cuDSS  alpha = 1,025923959153475
#     MUMPS  alpha = 1,025933553813083   ecart relatif 9,35e-06
# soit l'ORDRE DE GRANDEUR du bruit run-a-run sous un seul backend (7,7e-06).
# Un point unique ne permet donc pas de separer le biais du bruit : la
# question reste ouverte, mais elle est desormais mesurable.
#
# COUT : MUMPS rend l'algebre lineaire 3,4x plus chere (50 -> 174 s), mais
# comme elle ne pese que 9 % du solveur, le total monte de 21 % (+122 s par
# point). Sur ~592 appels, cela ferait +20 heures. A trancher pour le serveur,
# selon la disponibilite du GPU.
#
# Le run de fumee local (`moulin_blanc_fumee.toml`) tourne lui sur MUMPS,
# decision d'Agnes.
solveur_lineaire = "cudss"

# =========================================================================== #
# SESSION -- ce run, sur ce poste. Rien ici ne change le resultat.            #
# =========================================================================== #
n_workers_DOE = 6

# restart_enrich_only -- CHANGE DELIBEREMENT le 26/08/2026 (decision d'Agnes).
#
# Le script portait `true` : c'etait l'etat de TRAVAIL de son auteur, qui
# reprenait un enrichissement en cours a partir d'un `restart_state.json`. Ce
# fichier vit dans le `.ds` du modele et n'est pas dans le depot -- l'etude
# etait donc injouable ailleurs que sur le poste ou le dump existait.
#
# L'intention ici est de REJOUER LE RUN COMPLET, depuis le plan d'experiences.
# C'est exactement le genre de parametre qui n'a rien a faire dans une
# definition d'etude : il decrit une session, pas un probleme.
# `tests/test_85_configuration.py` connait cet ecart au golden et exige cette
# note.
restart_enrich_only = false

# save_history -- note de Mohamad Moussa, 04/07/2026, conservee telle quelle :
#   passe a false pour le run grille HF (q, s_convoi). ~424 Mo par appel SOCP
#   x 187 appels = ~79 Go, alors qu'il ne restait que ~24 Go sur C: et que
#   SOCP_history pesait deja 135 Go. Le disque aurait ete plein au quart de la
#   grille -- crash, et danger pour les AUTRES projets du poste.
#   A discuter avec Semia : purger ou archiver SOCP_history avant de reactiver.
save_history = false

# =========================================================================== #
# SORTIE -- ce qui est trace                                                  #
# =========================================================================== #
# ATTENTION, ET C'EST LE POINT LE PLUS COUTEUX DE CE FICHIER :
# `print_HF` declenche n_grid_hf^2 appels au solveur. A 15, cela fait
# 225 appels a 466 s, soit 29 HEURES -- pour une seule figure de contour, qui
# ne change aucun resultat. Le resume imprime en tete de journal le rappelle
# avant chaque run.
n_grid_hf = 15
print_fullHF = false
do_custom_hf = true

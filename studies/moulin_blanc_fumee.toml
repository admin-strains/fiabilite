# Moulin Blanc -- RUN DE FUMEE. Ce n'est PAS une etude.
#
# Objet : verifier que la chaine complete passe de bout en bout sur le vrai
# modele -- plan d'experiences, metamodele, enrichissement, FORM, tirage
# d'importance, grille haute fidelite, figures -- pour un cout tenable sur un
# poste local. Le calcul de reference se fera sur serveur.
#
# NE PAS CITER SES RESULTATS. L'enrichissement y est volontairement tronque :
# `n_max_EFF_points` et `n_grid_hf` sont des parametres d'ETUDE, ils changent
# le resultat. Les valeurs reelles sont dans `moulin_blanc.toml`.
#
#   parametre            fumee     etude reelle
#   n_max_EFF_points         5              360
#   n_grid_hf                2               15
#
# COUT ATTENDU :
#
#   plan d'experiences        5 appels  (sequentiel)
#   enrichissement EFF        5 appels
#   grille HF (2x2)           4 appels
#   FOSM aux modes           ~2 appels
#   ------------------------------------
#   total                   ~16 appels
#
# contre ~592 appels pour l'etude reelle. Le prix d'un appel depend fortement
# de la charge du poste -- deux mesures du 26/08/2026, meme point, meme
# machine :
#
#   poste au repos    466 s   (CAO 105 s + maillage  9 s + solveur 353 s)
#   poste charge      786 s   (CAO 179 s + maillage 11 s + solveur 595 s)
#
# soit entre 2 h 05 et 3 h 30 pour ce run de fumee. L'ecart vient de la
# concurrence memoire : le processus DS culmine a 3,1 Go et la RAM libre est
# descendue a 184 Mo pendant la mesure.
#
# S'utilise via la variable d'environnement qui choisit le fichier d'etude :
#
#   set FIABILITE_ETUDE=C:\workspace\fiabilite\studies\moulin_blanc_fumee.toml
#   python launcher.py Moulinblanc\AC3_moulinblanc.py

# =========================================================================== #
# ETUDE                                                                       #
# =========================================================================== #
modelname = "Calcul_fiabilite_G+LM1_13k_2fy_membrure_inf_diagonal"
storage = 'C:\workspace\storage\admin\Moulin_Blanc'

# --- metamodele : identique a l'etude reelle
modele = "GEPCK"
max_degree = 2
# 0,0 -- valeur historique de cette etude, retrouvee le 27/08/2026 au
# fond de `build_metamodel_KRG`. Elle differait de la flexion pure
# (1,0) sans que rien ne le signale. Conservee telle quelle.
theta_min_krg = 0.0

# Cadrage des figures : cette etude cadrait sur les bornes de recherche
# elargies de 1, la flexion pure sur les bornes de la grille HF. L'ecart
# etait recopie dans quatre fonctions de trace, sans commentaire.
# Conserve tel quel : le changer deplacerait toutes les figures.
cadre_figures = "bornes_elargies"
max_of_maxdegree = 2
seuil_pce = 0.90

# --- enrichissement : TRONQUE. 5 points suffisent a exercer la boucle
# (recherche EFF, evaluation HF, reconstruction du metamodele, critere
# d'arret) sans engager les 47 heures de l'etude reelle.
EFF_criteria = "BS"
n_max_EFF_points = 5

# --- domaine de recherche : BORNE (decision d'Agnes, 26/08/2026)
#
# Les bornes etaient a +/- 7,5, codees en dur dans le script. L'espace
# standard n'a pas de sens physique par lui-meme : ce sont les LOIS qui le lui
# donnent, et `fy ~ Normal(235 ; 30,15)` n'est pas bornee en bas.
#
#     u = -7,5   ->  fy =   8,88 MPa   (plus faible que le beton)
#     u = -7,79  ->  fy =   0
#     u = -8,5   ->  fy = -21,27 MPa
#
# Le run du 26/08 est mort au point u = [+7,5 ; -7,5], soit fy1/fy2 = 461/8,9,
# un rapport de 52 entre les deux groupes d'aciers. `docs/mesh/` documente
# qu'au-dela de ~5 les cones SOCP sont mal conditionnes. Digital Structure a
# termine le processus -- sans exception Python, en pleine iteration IPM,
# apres deux heures.
#
# POURQUOI 6,0 ET PAS MOINS -- deux contraintes qui se CONCURRENCENT :
#
#   1. Contenir le point de conception. Le point 1 du plan, u=[+4,69 ; -5,29],
#      donne g = +0,026 : l'etat limite passe a |u| ~ 5,3. Une borne en deca
#      l'excluerait, et FORM chercherait un optimum qu'il n'a pas le droit
#      d'atteindre. -> exige b >= ~5,5.
#   2. Garder les cones conditionnes, rapport <= 5. -> exige b <= 5,2.
#
# AUCUNE valeur ne satisfait les deux. 6,0 privilegie la premiere :
#
#     b      fy_min    fy_max   rapport au coin
#     5,2     78,2      391,8       5,0   (exclut le point de conception)
#     6,0     54,1      415,9       7,7   <-- retenu
#     7,5      8,9      461,1      52,0   (a tue le solveur)
#
# RISQUE ASSUME : 7,7 reste au-dessus du seuil documente de 5. Les points de
# COIN peuvent donc revenir NUMERICAL_ERROR. C'est desormais SIGNALE
# (`Evaluation.sain`) au lieu d'etre fatal -- a condition que le solveur rende
# la main plutot que de mourir, ce qu'on ne sait pas a 7,7. A 52 il mourait ;
# le point de conception, a 5,0, tourne OPTIMAL en 700 s.
#
# A noter : seule la GRILLE HF visite les coins. La recherche EFF vise g = 0,
# c'est-a-dire l'etat limite, ou le rapport vaut ~5 et ou le solveur tient.
eff_bound_min = -6.0
eff_bound_max = 6.0

# La grille HF a ses propres bornes (`_get_hf_slice` lit u1_min..u2_max, pas
# eff_bounds) : sans cette ligne elle retournerait balayer +/- 7,5.
u1_min = -6.0
u1_max = 6.0
u2_min = -6.0
u2_max = 6.0

# --- FORM : identique a l'etude reelle
tol_FORM = 0.05
do_FORM_filter = true

# --- solveur lineaire du point interieur
# MUMPS et non CuDss. Deux raisons.
#
# 1. Decision d'Agnes, 26/08/2026 : en local, MUMPS. (Pardiso est deprecie et
#    n'est plus propose.)
# 2. `Moulinblanc/InitSolver.py` portait `IPARM0[21] = 4` (CuDss) tandis que
#    `pure_flexion/InitSolver.py` porte `3` (MUMPS). Les deux etudes avaient
#    donc DIVERGE sans que rien ne le dise -- et c'est exactement la que se
#    separent les deux reproductibilites mesurees : 2,9e-11 sur la flexion
#    pure, 7,7e-06 sur le Moulin Blanc. Ce n'est pas une preuve (les modeles
#    n'ont ni la meme taille ni le meme conditionnement), mais le backend
#    devient enfin un parametre visible, donc testable.
#
# Mesure du premier point de ce DOE sous CuDss, avant bascule, pour comparaison
# ulterieure : g = 0,025923959153475  (journal C:\tmp\mb_fumee_cudss_pt1.log ;
# 90 appels cuDSS, 48,5 s cumules, dont 35,1 s de factorisation).
solveur_lineaire = "mumps"

# =========================================================================== #
# SESSION                                                                     #
# =========================================================================== #
# SEQUENTIEL, et c'est une decision mesuree, pas un defaut recopie.
#
# Un processus Digital Structure culmine a 3,1 Go sur ce modele (mesure du
# 26/08/2026, pic RSS echantillonne toutes les 2 s pendant un point complet).
# Le poste a 15,8 Go, mais la RAM libre est descendue a 184 Mo AVEC UN SEUL
# processus, l'editeur et ses serveurs d'indexation C++ en occupant environ 5.
# Un second worker n'y tient pas -- il aurait tue le run.
#
# Le gain aurait de toute facon ete faible : ce reglage ne concerne QUE les
# 5 points du plan initial. Avec `n_batch_EFF = 1` (le defaut), la boucle
# d'enrichissement prend toujours la branche sequentielle -- il n'existe
# aucun levier de parallelisme sur elle.
#
# CONSEQUENCE A ASSUMER : le chemin `run_DOE_parallel` reste NON EXERCE. Il
# faut le tester sur le serveur, ou la memoire n'est pas la contrainte -- pas
# ici, ou un echec par manque de RAM se confondrait avec un defaut de code.
n_workers_DOE = 1

restart_enrich_only = false
save_history = false

# =========================================================================== #
# SORTIE                                                                      #
# =========================================================================== #
# 2x2 = 4 appels, contre 225 a 15x15. La figure de contour sera grossiere :
# c'est un test de tuyauterie, pas une illustration.
n_grid_hf = 2
print_fullHF = false
do_custom_hf = false
